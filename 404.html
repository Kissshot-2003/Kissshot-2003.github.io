<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>404 — 页面不存在 · 洛橙</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#fbfbfb">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/style.css">
<script>
  (function () {
    try { if (localStorage.getItem('lc-theme') === 'dark') document.documentElement.setAttribute('data-theme', 'dark'); } catch (e) {}
  })();
</script>
<style>
  .err-wrap { max-width: var(--max); margin: 0 auto; min-height: 100vh; padding: 120px 24px 80px; display: flex; flex-direction: column; justify-content: center; }
  .err-code { font-family: var(--mono); font-size: clamp(5rem, 16vw, 11rem); line-height: .9; font-weight: 400; letter-spacing: -.06em; margin: 20px 0; }
  .err-code span { color: var(--accent); }
  .err-title { font-family: var(--mono); font-size: clamp(1.2rem, 3vw, 1.8rem); font-weight: 400; margin: 0 0 10px; }
  .err-desc { color: var(--text-2); font-size: 14px; max-width: 36em; margin: 0; }
  .err-actions { display: flex; gap: 10px; margin-top: 28px; flex-wrap: wrap; }
  .err-path { margin-top: 44px; padding-top: 16px; border-top: 1px solid var(--line); font-family: var(--mono); font-size: 11px; color: var(--text-3); word-break: break-all; }
  .err-path b { color: var(--accent); font-weight: 400; }
</style>
</head>
<body>
<main id="main" class="err-wrap">
  <div class="section-kicker mono">HTTP STATUS</div>
  <h1 class="err-code">4<span>0</span>4</h1>
  <h2 class="err-title">这一页不在档案里。</h2>
  <p class="err-desc">链接可能已经失效，或者地址拼错了。回到主页，从章节索引重新进入。</p>
  <div class="err-actions">
    <a class="btn btn-primary" href="/">返回主页 ↗</a>
    <a class="btn btn-ghost" href="https://github.com/Kissshot-2003" target="_blank" rel="noopener">GitHub 主页 ↗</a>
  </div>
  <div class="err-path mono"><b>GET</b> <span id="path">/unknown</span> → 404</div>
</main>
<script>
  (function () {
    var p = document.getElementById('path');
    if (p) p.textContent = location.pathname + location.search;
  })();
</script>
</body>
</html>
