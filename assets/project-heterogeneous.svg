<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <rect width="800" height="800" fill="#1a1a1a"/>
  <g font-family="monospace" font-size="11" fill="#6b6b6b"><text x="56" y="64">heterogeneous-tp / CommDomain</text></g>
  <rect x="56" y="82" width="688" height="1" fill="#2e2e2e"/>

  <!-- 两侧计算域 -->
  <rect x="56" y="130" width="210" height="130" fill="#1e1e1e" stroke="#3a3a3a"/>
  <g font-family="monospace" font-size="14" fill="#e5e5e5"><text x="76" y="166">CPU</text></g>
  <g font-family="monospace" font-size="11" fill="#6b6b6b"><text x="76" y="190">rayon / cache-aware</text></g>
  <g fill="#5a5a5a"><rect x="76" y="210" width="120" height="6"/><rect x="76" y="228" width="90" height="6"/></g>

  <rect x="534" y="130" width="210" height="130" fill="#1e1e1e" stroke="#3a3a3a"/>
  <g font-family="monospace" font-size="14" fill="#e5e5e5"><text x="554" y="166">GPU</text></g>
  <g font-family="monospace" font-size="11" fill="#6b6b6b"><text x="554" y="190">Vulkan / wgpu / WGSL</text></g>
  <g fill="#5a5a5a"><rect x="554" y="210" width="120" height="6"/><rect x="554" y="228" width="90" height="6"/></g>

  <!-- 统一通信域 -->
  <rect x="298" y="130" width="204" height="130" fill="#1a2a38" stroke="#007aff" stroke-opacity=".7"/>
  <g font-family="monospace" font-size="13" fill="#8bb9e8"><text x="322" y="170">CommDomain</text></g>
  <g font-family="monospace" font-size="10" fill="#4a6a8a"><text x="322" y="192">H2D / D2H staging</text><text x="322" y="212">row parallel</text><text x="322" y="232">all-reduce</text></g>

  <g stroke="#007aff" stroke-width="1.5" fill="none">
    <path d="M266 195 H298"/><path d="M502 195 H534"/>
  </g>

  <!-- 四设备 all-reduce 环 -->
  <g stroke="#3a3a3a" stroke-width="1.5" fill="none">
    <path d="M250 350 L550 350 L550 480 L250 480 Z"/>
    <path d="M250 350 L550 480M550 350 L250 480"/>
  </g>
  <g>
    <g transform="translate(250,350)"><circle r="22" fill="#1a1a1a" stroke="#007aff" stroke-width="1.5"/><circle r="5" fill="#007aff"/></g>
    <g transform="translate(550,350)"><circle r="22" fill="#1a1a1a" stroke="#6b6b6b"/><circle r="5" fill="#9a9a9a"/></g>
    <g transform="translate(550,480)"><circle r="22" fill="#1a1a1a" stroke="#6b6b6b"/><circle r="5" fill="#9a9a9a"/></g>
    <g transform="translate(250,480)"><circle r="22" fill="#1a1a1a" stroke="#6b6b6b"/><circle r="5" fill="#9a9a9a"/></g>
  </g>
  <g font-family="monospace" font-size="11" fill="#6b6b6b"><text x="330" y="332">4 logical devices · err 1.49e-6</text></g>

  <!-- 实测条形 -->
  <g font-family="monospace" font-size="11" fill="#6b6b6b"><text x="56" y="556">measured (RX 5700 XT)</text></g>
  <rect x="56" y="576" width="60" height="14" fill="#007aff"/>
  <rect x="116" y="576" width="480" height="14" fill="#2e2e2e"/>
  <g font-family="monospace" font-size="11" fill="#8bb9e8"><text x="56" y="612">gpu compute 34us</text><text x="250" y="612">submit/poll/map ~88%</text></g>
  <rect x="56" y="640" width="70" height="14" fill="#5a5a5a"/>
  <rect x="126" y="640" width="420" height="14" fill="#1a2a38" stroke="#007aff" stroke-opacity=".5"/>
  <g font-family="monospace" font-size="11" fill="#6b6b6b"><text x="56" y="676">D2H 40us (16KB)</text><text x="280" y="676">300us (&gt;16KB)</text></g>
  <g font-family="monospace" font-size="11" fill="#98c379"><text x="56" y="726">9 tests passed · row parallel + all-reduce OK</text></g>
</svg>
